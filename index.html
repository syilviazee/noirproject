<style>
:root{--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--serif:'Fraunces',Georgia,'Times New Roman',serif;--ink:#2b2723;--muted:#7a736b;--line:rgba(43,39,35,.12);--r:22px;--row:92px;--gap:14px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);min-height:100vh;background:#fbf7f0;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.wrap{position:relative;z-index:2}
/* NAV */
.topnav{position:sticky;top:0;z-index:30;display:flex;justify-content:center;padding:14px 12px}
.pill{display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);border:1.5px solid var(--line);box-shadow:0 10px 30px -14px rgba(40,30,20,.4)}
.navbtn{padding:9px 20px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;transition:background .25s,color .25s;user-select:none;white-space:nowrap}
.navbtn:hover{background:rgba(43,39,35,.07)}
.navbtn.active{background:var(--ink);color:#fff}
.page{max-width:1080px;margin:0 auto;padding:6px 16px 150px}
#slides{position:relative}
.slide{display:none;position:relative;min-height:calc(100vh - 90px)}
.slide.active,.slide.out{display:block}
.slide.out{position:absolute;top:0;left:0;right:0;pointer-events:none;animation:sOut .3s ease forwards}
.slide.in{animation:sIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes sIn{from{opacity:0;transform:translateX(calc(var(--d,1)*40px))}to{opacity:1;transform:none}}
@keyframes sOut{to{opacity:0;transform:translateX(calc(var(--d,1)*-40px))}}
/* TEXT */
.tx{white-space:pre-wrap;word-break:break-word;outline:none;border-radius:6px}
.edit .tx{min-height:1.2em;cursor:text}
.edit .tx[data-so]{cursor:pointer}
.edit .tx:empty::before{content:attr(data-ph);opacity:.4}
.edit .tx:hover{background:rgba(255,255,255,.4)}
.tx.sel{box-shadow:0 0 0 2px rgba(124,92,255,.55)}
body:not(.edit) .tx:empty{display:none}
/* COVER + HEAD */
.cover{height:clamp(150px,26vw,250px);border-radius:28px;position:relative;overflow:hidden;border:1.5px solid var(--line);background:#eee}
.chip{border:1.5px solid var(--line);background:rgba(255,255,255,.92);border-radius:999px;padding:7px 13px;font-size:12px;font-weight:600}
.cvbtn{position:absolute;right:12px;bottom:12px}
.head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 10px}
.avatar{width:132px;height:132px;border-radius:50%;border:6px solid #fff;box-shadow:0 12px 30px -12px rgba(0,0,0,.45);background:#eee center/cover no-repeat;position:relative;margin-top:-66px;flex:none}
.edit .avatar[data-act]{cursor:pointer;outline:2px dashed rgba(43,39,35,.3);outline-offset:4px}
.avatar.big{width:min(300px,70vw);height:min(300px,70vw);margin:0;border-width:8px}
.name{font-size:clamp(28px,5.5vw,44px);font-weight:800;line-height:1.1;margin-top:30px;font-family:var(--serif)}
.tagline{margin-top:8px;color:var(--muted);font-size:clamp(14px,2.4vw,17px);max-width:560px}
/* BENTO */
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:var(--row);gap:var(--gap);grid-auto-flow:dense;margin-top:32px}
.card{position:relative;border-radius:var(--r);padding:16px;border:1.5px solid rgba(43,39,35,.08);box-shadow:0 2px 0 rgba(43,39,35,.04),0 14px 30px -16px rgba(43,39,35,.35);display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s;min-width:0}
.card:hover{transform:translateY(-3px) rotate(-.5deg)}
.card:nth-child(even):hover{transform:translateY(-3px) rotate(.5deg)}
.card.tape::before{content:"";position:absolute;top:-8px;left:50%;width:58px;height:18px;transform:translateX(-50%) rotate(-4deg);background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.06);box-shadow:0 2px 4px rgba(0,0,0,.06);pointer-events:none;z-index:3}
.cbody{flex:1;min-height:0;overflow:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:8px}
.cbody::-webkit-scrollbar{display:none}
.cimg{width:100%;flex:1 1 0;min-height:60px;object-fit:cover;border-radius:14px;display:block}
.ctitle{font-weight:800;font-size:18px;line-height:1.2;flex:none}
.ctext{font-size:14px;line-height:1.5;flex:none}
.lp{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:16px;padding:8px;text-decoration:none;color:inherit;flex:none;transition:background .2s}
.lp:hover{background:#fff}
.lp .th{position:relative;width:56px;height:56px;border-radius:11px;overflow:hidden;background:rgba(0,0,0,.06);display:grid;place-items:center;flex:none}
.lp .th img{width:100%;height:100%;object-fit:cover}
.lp .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:15px;background:rgba(0,0,0,.25)}
.lp .mt{display:flex;flex-direction:column;min-width:0;flex:1}
.lp small{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.lp strong{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lp .go{font-style:normal;font-size:12px;font-weight:700;background:var(--ink);color:#fff;border-radius:999px;padding:6px 11px;white-space:nowrap}
.lp.big{flex-direction:column;align-items:stretch}
.lp.big .th{width:100%;height:auto;aspect-ratio:16/9;border-radius:12px}
.lp.big .go{align-self:flex-start}
.lp.Spotify .go{background:#1db954}
.lp.YouTube .go{background:#e62117}
.card.add{border:2px dashed rgba(43,39,35,.3);background:rgba(255,255,255,.5);font-weight:700;align-items:center;justify-content:center;grid-column:span 2}
/* edit controls */
.cctl{position:absolute;top:-12px;right:-6px;display:none;gap:4px;z-index:6}
.edit .cctl{display:flex}
.cctl button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.18);font-size:13px;line-height:1;display:grid;place-items:center}
.cctl .x{background:#ff5d5d;color:#fff;border-color:#ff5d5d}
.rz{position:absolute;right:-9px;bottom:-9px;width:28px;height:28px;border-radius:50%;background:var(--ink);border:3px solid #fff;cursor:nwse-resize;display:none;touch-action:none;z-index:6;box-shadow:0 4px 10px rgba(0,0,0,.3);transition:transform .15s}
.rz::after{content:"";position:absolute;inset:-10px}
.rz:hover{transform:scale(1.15)}
.rz::before{content:"";position:absolute;right:5px;bottom:5px;width:8px;height:8px;border-right:2px solid #fff;border-bottom:2px solid #fff}
.card.resizing{transition:none!important;transform:none!important;justify-self:start;align-self:start;z-index:12;will-change:width,height;box-shadow:0 0 0 2px #7c5cff,0 24px 44px -16px rgba(0,0,0,.45);user-select:none}
.card.resizing::after{content:attr(data-size);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(43,39,35,.85);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;pointer-events:none}
.card.settle{transition:width .22s cubic-bezier(.2,.8,.2,1),height .22s cubic-bezier(.2,.8,.2,1)!important;justify-self:start;align-self:start}
body.sizing,body.sizing *{cursor:nwse-resize!important;user-select:none!important}
.edit .rz{display:block}
.edit .card[data-card]{outline:2px dashed rgba(43,39,35,.22);outline-offset:3px}
/* GALLERY */
.gal-top{padding-top:8px}
.gal-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.gbtn,.abtn{padding:10px 22px;border-radius:999px;border:1.5px solid var(--ink);background:#fff;font-weight:700;font-size:14px;cursor:pointer;user-select:none;transition:transform .15s,background .2s}
.gbtn:hover,.abtn:hover{transform:translateY(-2px)}
.abtn.primary{background:var(--ink);color:#fff}
.gcount{font-size:12px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.7);padding:5px 11px;border-radius:999px}
.gmain{height:calc(var(--row)*4 + var(--gap)*3);margin-top:6px}
.gal-edit{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.divider{border:0;border-top:3px solid var(--ink);margin:34px 0;opacity:.85}
.divider.soft{border-top:2px dashed var(--line);margin:40px 0 26px}
.gal-bottom{display:flex;align-items:center;gap:10px}
.arrow{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;font-size:15px;transition:transform .15s}
.arrow:hover{transform:scale(1.1)}
.track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px 10px 22px;flex:1;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.polaroid{flex:none;width:min(220px,58vw);background:#fff;padding:10px 10px 8px;border-radius:6px;box-shadow:0 12px 24px -12px rgba(0,0,0,.4);scroll-snap-align:center;transform:rotate(var(--rot,0deg));position:relative;transition:transform .25s}
.polaroid:hover{transform:rotate(0) scale(1.03)}
.polaroid img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;border-radius:3px}
.pcap{font-family:var(--serif);font-style:italic;font-size:14px;margin-top:8px;text-align:center}
.polaroid .px{position:absolute;top:-10px;right:-8px;width:28px;height:28px;border-radius:50%;border:0;background:#ff5d5d;color:#fff;display:none}
.edit .polaroid .px{display:block}
.polaroid.addp{display:grid;place-items:center;min-height:250px;border:2px dashed rgba(43,39,35,.3);background:rgba(255,255,255,.6);font-weight:700;cursor:pointer;transform:none}
/* ABOUT */
.about{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center;padding-top:30px}
.a-title{font-size:clamp(30px,6vw,52px);font-weight:800;line-height:1.08;font-family:var(--serif)}
.a-sub{margin-top:14px;font-size:clamp(15px,2.4vw,18px);line-height:1.6;color:#4d463f}
.about-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;position:relative}
.about-r{display:flex;justify-content:center}
.cpop{position:absolute;left:0;top:100%;margin-top:10px;z-index:15;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:10px;min-width:230px;box-shadow:0 20px 40px -16px rgba(0,0,0,.4)}
.cpop[hidden]{display:none}
.cpop a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;text-decoration:none;color:inherit;font-weight:600;font-size:14px}
.cpop a:hover{background:rgba(0,0,0,.05)}
.cpop p{padding:8px 10px;color:var(--muted);font-size:13px}
.msg-l{font-weight:700;font-size:15px;margin-bottom:14px}
.cm-wrap{display:flex;flex-direction:column;gap:18px}
.cm-form,.cm-feed{background:rgba(255,255,255,.78);border:1.5px solid var(--line);border-radius:24px;padding:18px;backdrop-filter:blur(8px)}
.cm-form{display:flex;flex-direction:column;gap:10px}
.cm-form input,.cm-form textarea{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;font-size:14px;width:100%;resize:vertical}
.cm-form textarea{min-height:84px}
.cm-as{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cm-as b{color:var(--ink)}
.badge{background:var(--ink);color:#fff;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;display:inline-block}
.reply-chip{font-size:12px;background:rgba(0,0,0,.06);padding:6px 10px;border-radius:999px;align-self:flex-start}
.btn{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.wide{width:100%}
.btn.danger{background:#ff5d5d}
.cm{padding:14px 0;border-bottom:1px dashed var(--line)}
.cm:last-child{border:0}
.cm.rep{margin:12px 0 0 22px;padding:12px 14px;background:rgba(0,0,0,.035);border-radius:16px;border:0}
.cm.own>.cm-t{font-weight:500}
.cm-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cm-av{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.cm-n{font-weight:700;font-size:14px}
.cm time{font-size:11px;color:var(--muted);margin-left:auto}
.cm-t{margin:8px 0 6px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.cm-a button{background:none;border:0;font-size:12px;font-weight:700;color:var(--muted);padding:4px 10px 4px 0}
.cm-a .del{color:#e03a3a}
.cm-pics{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.cm-pics img{width:110px;height:110px;object-fit:cover;border-radius:12px;cursor:zoom-in;border:1px solid var(--line)}
.cm-draft{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dp{position:relative;display:inline-block}
.dp img{width:64px;height:64px;object-fit:cover;border-radius:10px;display:block;border:1px solid var(--line)}
.dp button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:0;background:#ff5d5d;color:#fff;font-size:11px;line-height:1}
.rtb{position:fixed;z-index:90;display:flex;gap:2px;padding:5px;background:var(--ink);border-radius:12px;box-shadow:0 14px 30px -10px rgba(0,0,0,.55);animation:rtbIn .15s ease}
@keyframes rtbIn{from{opacity:0;transform:translateY(4px)}}
.rtb[hidden]{display:none}
.rtb button{width:36px;height:34px;border:0;border-radius:8px;background:transparent;color:#fff;font-size:15px;line-height:1}
.rtb button:hover{background:rgba(255,255,255,.16)}
.rtb button.on{background:rgba(255,255,255,.3)}
.rtb .sep{width:1px;background:rgba(255,255,255,.25);margin:4px 3px}
.cm-ed{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;font-size:14px;line-height:1.5;width:100%;min-height:84px;max-height:240px;overflow:auto;outline:none;white-space:pre-wrap;word-break:break-word}
.cm-ed:focus{border-color:var(--ink)}
.cm-ed:empty::before{content:attr(data-ph);opacity:.45}
.cm-hint{font-size:11px;color:var(--muted)}
.gate{position:fixed;inset:0;z-index:150;display:grid;place-items:center;padding:20px;overflow:auto;background:radial-gradient(circle at 15% 20%,#ffe3d1 0,transparent 45%),radial-gradient(circle at 85% 15%,#e2d6ff 0,transparent 45%),radial-gradient(circle at 70% 90%,#d3f2e4 0,transparent 45%),#fbf7f0}
.gate[hidden]{display:none}
body.locked{overflow:hidden}
.gcard{position:relative;width:min(420px,100%);background:#fffdf9;border:1.5px solid var(--line);border-radius:28px;padding:30px 24px 22px;box-shadow:0 30px 60px -24px rgba(43,39,35,.45);display:flex;flex-direction:column;gap:14px;animation:up .35s ease}
.gcard::before{content:"";position:absolute;top:-10px;left:50%;width:72px;height:20px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,214,165,.75);border:1px solid rgba(0,0,0,.06)}
.glogo{width:56px;height:56px;border-radius:18px;background:var(--ink);display:grid;place-items:center;font-size:26px;align-self:center;transform:rotate(-4deg)}
.gcard h2{font-family:var(--serif);font-size:24px;text-align:center}
.gsub{text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.gform{display:flex;flex-direction:column;gap:12px}
.gform>label:not(.rem){display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.gin{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-size:15px;width:100%;outline:none;color:var(--ink)}
.gin:focus{border-color:var(--ink)}
.pw{position:relative;display:block}
.pw .gin{padding-right:46px}
.pwt{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;border-radius:10px;font-size:16px}
.rem{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink)}
.gerr{min-height:20px;color:#d33;font-size:13px;font-weight:600;line-height:1.4}
.gfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gforgot{border:0;background:none;font-size:12px;color:var(--muted);text-decoration:underline;padding:4px}
.gforgot.armed{color:#d33;font-weight:700}
.acct{display:flex;gap:12px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px}
.acct .cm-av{width:44px;height:44px;font-size:18px}
.acct b{display:block;font-size:14px;word-break:break-all}.acct small{color:var(--muted);font-size:12px}
.gok{color:#1a8f4d}
.dbtn.sync{cursor:default;font-size:12px;padding:10px 12px}
a.dbtn{text-decoration:none;color:var(--ink)}a.dbtn.on{color:#fff}
.nf{min-height:100vh;display:grid;place-content:center;justify-items:center;text-align:center;gap:14px;padding:24px;position:relative;z-index:2}
.nf h2{font-family:var(--serif);font-size:30px}.nf p{color:var(--muted)}
/* STICKERS */
.stk-layer{position:absolute;inset:0;pointer-events:none;z-index:20}
.stk{position:absolute;pointer-events:none}
.stk img{width:100%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.edit .stk{pointer-events:auto;cursor:grab;touch-action:none;outline:2px dashed rgba(124,92,255,.5);outline-offset:3px}
.stk-x,.stk-rz{display:none;position:absolute}
.edit .stk-x{display:block;top:-12px;right:-12px;width:26px;height:26px;border-radius:50%;border:0;background:#ff5d5d;color:#fff;font-size:13px}
.edit .stk-rz{display:block;right:-9px;bottom:-9px;width:20px;height:20px;border-radius:50%;background:#7c5cff;border:3px solid #fff;cursor:nwse-resize;touch-action:none}
/* DOCK */
.dock{position:fixed;z-index:60;right:16px;bottom:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.dbtn{border:1.5px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-radius:999px;padding:10px 15px;font-weight:600;font-size:13px;box-shadow:0 10px 24px -10px rgba(0,0,0,.4);display:flex;gap:6px;align-items:center}
.dbtn.on{background:var(--ink);color:#fff}
.fmt{position:fixed;z-index:70;left:50%;transform:translateX(-50%);top:72px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:8px 10px;box-shadow:0 18px 40px -16px rgba(0,0,0,.45);max-width:calc(100vw - 16px)}
.fmt[hidden]{display:none}
.fmt-l{font-size:11px;font-weight:700;color:#7c5cff;background:rgba(124,92,255,.1);padding:4px 9px;border-radius:999px}
.fmt button,.fmt select{border:1.5px solid var(--line);background:#fff;border-radius:10px;height:32px;min-width:32px;padding:0 8px;font-size:13px}
.fmt button.on{background:var(--ink);color:#fff}
.fmt input[type=number]{width:52px;height:32px;border:1.5px solid var(--line);border-radius:10px;text-align:center}
.fmt input[type=color]{width:34px;height:32px;border:1.5px solid var(--line);border-radius:10px;padding:2px;background:#fff}
.fmt .sz{display:flex;gap:3px}
.fmt svg{display:block;margin:auto}
/* MODAL */
#modal{position:fixed;inset:0;z-index:100;display:none;background:rgba(30,25,20,.45);backdrop-filter:blur(3px);align-items:flex-end;justify-content:center}
#modal.open{display:flex}
.sheet{position:relative;background:#fffdf9;width:min(660px,100%);max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:24px 22px 28px;animation:up .3s ease;display:flex;flex-direction:column;gap:14px}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:26px}}
.sheet h3{font-size:20px;font-family:var(--serif)}
.sheet h4{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sx{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.07)}
.row{display:flex;gap:8px;align-items:center}
.row input,.row select,.sheet input[type=url],.sheet input[type=text],.sheet input[type=password]{flex:1;min-width:0;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:14px;width:100%}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.06);padding:4px;border-radius:14px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 10px;font-weight:600;font-size:13px;white-space:nowrap}
.seg button.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.hsb{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px}
.hsb-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}
.hsb .sw{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line)}
.hsb label,.rng{display:flex;align-items:center;gap:10px;font-size:12px}
.hsb label span,.rng span{width:70px;color:var(--muted);font-weight:600}
.hsb output{width:30px;text-align:right;font-size:12px;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:10px;border-radius:99px;background:var(--track,#ddd);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--ink);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--ink);cursor:pointer}
.thumb{width:100%;max-height:150px;object-fit:cover;border-radius:14px}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.sheet textarea[data-pub]{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:14px;resize:vertical;min-height:76px}
.ogp{border:1.5px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.ogp .im{height:130px;position:relative;background-size:cover}
.ogp .im i{position:absolute;left:16px;bottom:-24px;width:56px;height:56px;border-radius:50%;border:4px solid #fff;background:#eee center/cover}
.ogp div.tt{padding:30px 16px 14px}
.ogp b{display:block;font-size:15px}.ogp span{font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);z-index:200;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){
 :root{--row:84px;--gap:10px}
 .bento{grid-template-columns:repeat(2,1fr)}
 .about{grid-template-columns:1fr;text-align:center}
 .about-r{order:-1}
 .about-btns{justify-content:center}
 .cpop{left:50%;transform:translateX(-50%)}
 .avatar{width:112px;height:112px;margin-top:-56px}
 .dock{left:10px;right:10px;bottom:10px;justify-content:center}
 .dbtn span{display:none}
 .dbtn{padding:11px 15px;font-size:16px}
 .navbtn{padding:9px 15px}
 .fmt{top:62px}
 .card.add{grid-column:span 2}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function cleanHTML(h){
 const root=new DOMParser().parseFromString('<body>'+String(h==null?'':h)+'</body>','text/html').body;let out='';
 const BLK=/^(DIV|P|LI|H[1-6]|BLOCKQUOTE|PRE|TR|UL|OL)$/;
 const endsBr=()=>!out||/<br>$/.test(out);
 const tags=n=>{const t=n.tagName,a=[];if(RT_MAP[t])a.push(RT_MAP[t]);if(t==='SPAN'||t==='FONT'){const st=n.style||{},fw=st.fontWeight;if(fw==='bold'||parseInt(fw)>=600)a.push('b');if(st.fontStyle==='italic')a.push('i');if(((st.textDecoration||'')+(st.textDecorationLine||'')).includes('underline'))a.push('u')}return a};
 const walk=n=>{
  if(n.nodeType===3){out+=esc(n.nodeValue).replace(/ /g,' ').replace(/\r?\n/g,'<br>');return}
  if(n.nodeType!==1)return;const t=n.tagName;
  if(t==='BR'){out+='<br>';return}
  if(/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|NOSCRIPT|TEMPLATE|IMG|SVG|VIDEO|AUDIO|CANVAS|INPUT|TEXTAREA|SELECT|BUTTON)$/.test(t))return;
  const blk=BLK.test(t),tg=tags(n);
  if(blk&&!endsBr())out+='<br>';
  tg.forEach(x=>out+='<'+x+'>');[...n.childNodes].forEach(walk);tg.slice().reverse().forEach(x=>out+='</'+x+'>');
  if(blk&&!endsBr())out+='<br>'};
 [...root.childNodes].forEach(walk);return out.replace(/(<br>)+$/,'')}

/* Gambar OG 1200x630: banner aktif + foto profil + nama. Diunggah ke storage saat Publikasi / saat banner & foto berubah. */
async function composeOG(){
 const W=1200,H=630,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
 const li=u=>new Promise(r=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>r(i);i.onerror=()=>r(null);i.src=u});
 const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()};
 g.fillStyle='#fbf7f0';g.fillRect(0,0,W,H);
 g.save();rr(40,40,W-80,340,40);g.clip();
 const cv=S.cover;let ci=cv.mode==='image'&&cv.img?await li(cv.img):null;
 if(ci){const k=Math.max((W-80)/ci.width,340/ci.height);g.drawImage(ci,40+(W-80-ci.width*k)/2,40+(340-ci.height*k)/2,ci.width*k,ci.height*k)}
 else{const gr=g.createLinearGradient(40,40,W-40,380);gr.addColorStop(0,hsb(cv.c1));gr.addColorStop(1,hsb(cv.mode==='gradient'?cv.c2:cv.c1));g.fillStyle=gr;g.fillRect(0,0,W,H)}
 g.restore();
 const ai=await li(S.profile.img||AV_DEF);g.save();g.beginPath();g.arc(190,390,92,0,7);g.closePath();g.fillStyle='#fff';g.fill();g.beginPath();g.arc(190,390,84,0,7);g.clip();
 if(ai){const k=Math.max(168/ai.width,168/ai.height);g.drawImage(ai,190-ai.width*k/2,390-ai.height*k/2,ai.width*k,ai.height*k)}g.restore();
 g.fillStyle='#2b2723';g.font='700 66px Georgia,serif';g.fillText(plain(tv(gt('name')),28),310,440);
 return new Promise((res,rej)=>{try{c.toBlob(b=>b?res(b):rej(),'image/png')}catch(e){rej(e)}})}
const dl=(name,data,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};

let fxRaf=0;
function fxStart(){
 cancelAnimationFrame(fxRaf);const cv=$('#fx'),g=cv.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1);
 cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,innerWidth,innerHeight);
 const type=S.fx.type;if(type==='none')return;
 const n=Math.min(90,Math.round(innerWidth*innerHeight/(type==='stars'?17000:type==='bubbles'?30000:11000)));
 const mk=init=>({x:Math.random()*innerWidth,y:init?Math.random()*innerHeight:(type==='snow'?-10:innerHeight+40),r:type==='bubbles'?6+Math.random()*22:type==='stars'?3+Math.random()*7:1.5+Math.random()*3.2,vy:type==='bubbles'?-(.3+Math.random()*.7):type==='snow'?.4+Math.random()*1:0,vx:(Math.random()-.5)*.4,ph:Math.random()*6.28,hue:Math.random()*360});
 const P=Array.from({length:n},()=>mk(true));
 const star=(x,y,r)=>{g.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rad=i%2?r*.3:r;g.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}g.closePath()};
 const loop=t=>{g.clearRect(0,0,innerWidth,innerHeight);
  for(const p of P){p.x+=p.vx+Math.sin(t/1500+p.ph)*.3;p.y+=p.vy;
   if(type==='stars'){g.globalAlpha=.25+.75*Math.abs(Math.sin(t/700+p.ph));g.shadowColor='rgba(255,200,80,.9)';g.shadowBlur=10;g.fillStyle='#ffd86b';star(p.x,p.y,p.r);g.fill();g.shadowBlur=0}
   else if(type==='bubbles'){g.globalAlpha=.9;const gr=g.createRadialGradient(p.x-p.r*.3,p.y-p.r*.3,p.r*.1,p.x,p.y,p.r);gr.addColorStop(0,`hsla(${p.hue},90%,92%,.55)`);gr.addColorStop(1,`hsla(${p.hue},90%,80%,.12)`);g.fillStyle=gr;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=1.3;g.stroke();g.beginPath();g.arc(p.x-p.r*.35,p.y-p.r*.35,p.r*.22,3.4,4.7);g.stroke()}
   else{g.globalAlpha=.9;g.shadowColor='rgba(90,110,150,.4)';g.shadowBlur=4;g.fillStyle='#fff';g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();g.shadowBlur=0}
   if(p.y>innerHeight+50||p.y<-50||p.x<-40||p.x>innerWidth+40)Object.assign(p,mk(false))}
  g.globalAlpha=1;fxRaf=requestAnimationFrame(loop)};
 fxRaf=requestAnimationFrame(loop)}

function syncFmt(){
 const el=$(`[data-tk="${CSS.escape(sel)}"]`);if(!el)return;const cs=getComputedStyle(el),f=$('#fmt');
 f.querySelector('[data-fmt=font]').value=(cs.fontFamily.includes('Fraunces')||cs.fontFamily.startsWith('Georgia'))?'serif':'sans';
 f.querySelector('[data-fmt=b]').classList.toggle('on',parseInt(cs.fontWeight)>=600);
 f.querySelector('[data-fmt=i]').classList.toggle('on',cs.fontStyle==='italic');
 f.querySelector('[data-fmt=u]').classList.toggle('on',cs.textDecorationLine.includes('underline'));
 f.querySelector('input[data-fmt=size]').value=Math.round(parseFloat(cs.fontSize));
 f.querySelector('[data-fmt=color]').value=rgb2hex(cs.color);
 const al=cs.textAlign==='start'?'left':cs.textAlign==='end'?'right':cs.textAlign;
 f.querySelectorAll('[data-fmt=al]').forEach(b=>b.classList.toggle('on',b.dataset.v===al))}
function applyFmt(op,val){
 if(!sel)return;const o=gt(sel),s={...o.s},el=$(`[data-tk="${CSS.escape(sel)}"]`),cs=el?getComputedStyle(el):null;
 if(el&&(op==='b'||op==='i'||op==='u')){const sl=getSelection();if(sl.rangeCount&&!sl.isCollapsed&&el.contains(sl.anchorNode)&&el.contains(sl.focusNode)&&el.isContentEditable){rtCmd({b:'bold',i:'italic',u:'underline'}[op]);syncFmt();return}}
 if(op==='font')s.font=val;
 if(op==='b')s.b=!(parseInt(cs.fontWeight)>=600);
 if(op==='i')s.i=cs.fontStyle!=='italic';
 if(op==='u')s.u=!cs.textDecorationLine.includes('underline');
 if(op==='size')s.size=clamp(+val||16,8,120);
 if(op==='size+')s.size=clamp(Math.round(parseFloat(cs.fontSize))+1,8,120);
 if(op==='size-')s.size=clamp(Math.round(parseFloat(cs.fontSize))-1,8,120);
 if(op==='al')s.align=val;
 if(op==='color')s.color=val;
 if(op==='reset')for(const k of Object.keys(s))delete s[k];

 csaving=false;if(error){cdirty=true;setSync('error');toast(I('syncErr'))}else setSync(cdirty?'saving':'saved')}
addEventListener('beforeunload',e=>{if(CLOUD&&(cdirty||csaving)){e.preventDefault();e.returnValue=''}});
const rowToC=r=>({id:r.id,pid:r.parent_id||null,name:r.name,text:r.body_text||'',html:r.body_html||'',ts:Date.parse(r.created_at)||Date.now(),owner:!!r.is_owner,title:r.owner_title||'',pics:Array.isArray(r.pics)?r.pics:[]});
async function loadComments(){
 if(!CLOUD||!SITE_ID)return;
 const {data,error}=await sb.from('comments').select('*').eq('site_id',SITE_ID).order('created_at',{ascending:true}).limit(500);
 if(error||!data)return;S.comments=data.map(rowToC);renderComments()}
async function uploadBlob(blob,ext){const path=`${AUTH.uid}/${Date.now()}-${uid()}.${ext}`;const {error}=await sb.storage.from('media').upload(path,blob,{contentType:blob.type,cacheControl:'31536000'});if(error)throw error;return sb.storage.from('media').getPublicUrl(path).data.publicUrl}
async function uploadDataUrl(d){const b=await (await fetch(d)).blob();return uploadBlob(b,b.type==='image/png'?'png':'jpg')}
const authErr=e=>{const m=(e&&e.message)||'';if(/invalid login/i.test(m))return I('gErrBad');if(/not confirmed/i.test(m))return I('gNotConf');if(/already registered/i.test(m))return I('gExists');return m||I('gErrBad')};
async function enterCloud(user){
 AUTH.user=user.email;AUTH.uid=user.id;AUTH.created=Date.parse(user.created_at)||0;
 const cols='id,data,slug,published';
 let {data:row,error}=await sb.from('sites').select(cols).eq('owner',user.id).maybeSingle();
 if(error){toast(I('syncErr'));return false}
 if(!row){const fresh=DEF();fresh.lang=S.lang;const r=await sb.from('sites').insert({owner:user.id,data:fresh,title:'',description:''}).select(cols).single();if(r.error){toast(I('syncErr'));return false}row=r.data}
 SITE_ID=row.id;S=loadState(row.data);S.comments=[];if(row.slug){S.publish.slug=row.slug;S.publish.published=!!row.published}OGSIG=ogSig();
 await loadComments();return true}
let ENTERING=false,LOGGING_OUT=false,BOOTED=false,OGSIG='';
const ogSig=()=>JSON.stringify([S.cover.mode,String(S.cover.img||'').slice(0,300),S.cover.c1,S.cover.c2,String(S.profile.img||'').slice(0,300),plain(tv(gt('name')),28)]);
async function cloudStart(user,edit){
 if(ENTERING||AUTH.uid===user.id)return; /* cegah dobel masuk (event SIGNED_IN + hasil login) */
 ENTERING=true;
 try{
  if(!(await enterCloud(user))){try{await sb.auth.signOut()}catch(e){}AUTH.user=null;AUTH.uid=null;SITE_ID=null;lockApp();return}
  hideGate();EDIT=!!edit;render();fxStart();if(edit)toast(I('welcome'));if(RECOV)openRecovery()
 }finally{ENTERING=false}}
/* bersihkan #access_token / ?code= dari address bar setelah sesi terbaca */
function cleanAuthUrl(){try{const u=new URL(location.href);['code','error','error_code','error_description'].forEach(k=>u.searchParams.delete(k));history.replaceState(null,'',u.pathname+u.search)}catch(e){}}
/* handler perubahan sesi (login, logout di tab lain, reset password) */
function onAuth(ev,session){
 if(ev==='PASSWORD_RECOVERY'){RECOV=true;if(AUTH.uid&&!VIEW)openRecovery();return}
 if(!BOOTED)return; /* saat startup, boot() yang membaca sesi dari URL callback */
 /* jangan await panggilan Supabase langsung di dalam callback ini -> tunda dengan setTimeout */
 if(ev==='SIGNED_IN'&&session&&session.user){setTimeout(()=>{if(!VIEW&&!SLUG)cloudStart(session.user,true)},0);return}
 if(ev==='SIGNED_OUT'){setTimeout(()=>{
  if(LOGGING_OUT||ENTERING||!AUTH.uid)return;
  clearTimeout(cst);AUTH.user=null;AUTH.uid=null;OWNS=false;SITE_ID=null;EDIT=false;S=DEF();setSync('idle');
  if(VIEW)render();else lockApp()},0)}}
async function loadPublic(slug){
 VIEW=true;
 const [{data:row},ses]=await Promise.all([sb.from('sites').select('id,owner,data,slug,published').eq('slug',slug).eq('published',true).maybeSingle(),sb.auth.getSession().then(r=>r.data.session)]);
 if(ses){AUTH.user=ses.user.email;AUTH.uid=ses.user.id}
 if(!row){document.title='404';$('#root').innerHTML=`<div class="nf"><h2>${I('nf')}</h2><p>${I('nfSub')}</p><a class="btn" href="${esc(ROOT)}" style="text-decoration:none">✨ ${I('makeOwn')}</a></div>`;return}
 SITE_ID=row.id;OWNS=!!(ses&&ses.user.id===row.owner);S=loadState(row.data);S.comments=[];S.publish.slug=row.slug;S.publish.published=true;
 await loadComments();render();fxStart()}
async function doAuthCloud(){
 const btn=$('#gsub'),email=$('#gEmail').value.trim().toLowerCase(),pw=$('#gPass').value,reg=GTAB==='register';GEMAIL=email;
 const fail=m=>{GERR=m;GOK='';const e=$('#gerr');if(e){e.textContent=m;e.className='gerr'}if(btn)btn.disabled=false};
 if(!emailOk(email))return fail(I('gErrEmail'));
 if(btn)btn.disabled=true;
 try{
  if(reg){
   if(pw.length<8)return fail(I('gErrPass'));if(pw!==$('#gPass2').value)return fail(I('gErrMatch'));
   const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:ORIGIN}});
   if(error)return fail(authErr(error));
   if(!data.session){GOK=I('gCheckMail');GERR='';GTAB='login';return paintGate(false)}
   return cloudStart(data.user,true)}
  const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error)return fail(authErr(error));
  return cloudStart(data.user,true)
 }catch(e){return fail(I('gErrBad'))}}
function publishCloudHTML(){
 const p=S.publish,link=fullUrl();
 return `<h3>🚀 ${I('pubTitle')}</h3>
 <div class="row"><span style="font-weight:700;white-space:nowrap;font-size:13px">${esc(location.host||'site')}/?p=</span><input type="text" data-pub="slug" value="${esc(p.slug)}" placeholder="nama-kamu" maxlength="40"></div>
 <div class="note">${p.published?'🟢 '+I('pubLive'):'⚪ '+I('pubDraft')}</div>
 ${p.slug&&p.published?`<div class="ogp" style="padding:12px"><b style="font-size:14px;word-break:break-all">${esc(link)}</b><div class="row" style="margin-top:8px"><button class="btn alt" data-act="pubCopy">${I('pubCopy')}</button><a class="btn alt" href="${esc(link)}" target="_blank" rel="noopener" style="text-decoration:none">${I('open')} ↗</a></div></div>`:''}
 <h4>${I('ogBio')}</h4><textarea data-pub="bio" maxlength="200" rows="3" placeholder="${esc(I('ogBioPh'))}">${esc(p.bio||'')}</textarea><div class="note" id="bioCnt">${(p.bio||'').length}/200</div>
 <h4>${I('ogPrev')}</h4><div class="ogp"><div class="im" id="ogIm"><i id="ogAv"></i></div><div class="tt"><b id="ogTt">${esc(metaInfo().title)}</b><span id="ogDs">${esc(metaInfo().desc)}</span></div></div>
 <button class="btn wide" data-act="pubSave">${p.published?I('pubUpdate'):I('pubSave')}</button>${p.published?`<button class="btn alt wide" data-act="pubOff">${I('pubOff')}</button>`:''}
 <p class="note">${I('pubNoteCloud')}</p>`}
function openRecovery(){RECOV=false;openSheet(()=>`<h3>🔑 ${I('pwNew')}</h3><input type="password" id="rcNew" autocomplete="new-password" placeholder="${esc(I('pwNew'))}"><input type="password" id="rcNew2" autocomplete="new-password" placeholder="${esc(I('gPass2'))}"><button class="btn wide" data-act="rcSave">${I('pwSave')}</button>`)}
/* ============ AUTH (client-side owner gate) ============ */
const ACC_KEY='bento-account-v1',SES_KEY='bento-session-v1',LCK_KEY='bento-authlock-v1',GMAIL_ONLY=true,ITER=150000;
let GOK='',GTAB='login',GERR='',GEMAIL='',GREM=true,GDIS=false,GARM=false;
const lsGet=(st,k)=>{try{return JSON.parse(st.getItem(k))}catch(e){return null}};
const lsSet=(st,k,v)=>{try{st.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
const getAcc=()=>lsGet(localStorage,ACC_KEY);
const emailOk=e=>GMAIL_ONLY?/^[a-z0-9._%+-]+@(gmail|googlemail)\.com$/i.test(e):/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
const hasSubtle=()=>!!(window.crypto&&crypto.subtle&&crypto.subtle.importKey);
const b64=buf=>{let s='';new Uint8Array(buf).forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const rndSalt=()=>{const a=new Uint8Array(16);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<16;i++)a[i]=Math.random()*256;return b64(a)};
async function derive(pw,salt,alg){
 if(alg==='pbkdf2'){if(!hasSubtle())return '';const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unb64(salt),iterations:ITER},k,256))}
 let h1=0xdeadbeef,h2=0x41c6ce57;const str=salt+'|'+pw;for(let r=0;r<3000;r++)for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
 h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0).toString(16)+(h1>>>0).toString(16)}
const getSes=()=>lsGet(sessionStorage,SES_KEY)||lsGet(localStorage,SES_KEY);
const endSes=()=>{try{sessionStorage.removeItem(SES_KEY);localStorage.removeItem(SES_KEY)}catch(e){}};
function startSes(email,remember){endSes();lsSet(remember?localStorage:sessionStorage,SES_KEY,{email,ts:Date.now()})}
function restoreSes(){const a=getAcc(),s=getSes();if(a&&s&&s.email===a.email){AUTH.user=a.email;return true}return false}
const keepG=()=>{const e=$('#gEmail');if(e)GEMAIL=e.value};
function paintGate(focus){
 const g=$('#gate'),acc=getAcc(),reg=GTAB==='register';
 g.innerHTML=`<div class="gcard">${GDIS?`<button class="sx" data-act="gClose" aria-label="close">✕</button>`:''}<div class="glogo">🔐</div><h2>${I('gTitle')}</h2><p class="gsub">${I(reg?'gSubReg':'gSubLogin')}</p>
 <div class="seg"><button class="${reg?'':'on'}" data-act="gTab" data-v="login">${I('gLogin')}</button><button class="${reg?'on':''}" data-act="gTab" data-v="register">${I('gRegister')}</button></div>
 <form id="gform" class="gform" novalidate>
  <label>${I('gEmail')}<input class="gin" id="gEmail" type="email" name="email" autocomplete="username" inputmode="email" placeholder="nama@gmail.com" value="${esc(GEMAIL)}"></label>
  <label>${I('gPass')}<span class="pw"><input class="gin" id="gPass" type="password" name="password" autocomplete="${reg?'new-password':'current-password'}" placeholder="••••••••"><button type="button" class="pwt" data-act="pwToggle" aria-label="show/hide">👁</button></span></label>
  ${reg?`<label>${I('gPass2')}<input class="gin" id="gPass2" type="password" autocomplete="new-password" placeholder="••••••••"></label>`:''}
  ${CLOUD?'':`<label class="rem"><input type="checkbox" id="gRem" ${GREM?'checked':''}> ${I('gRemember')}</label>`}
  <div class="gerr ${GOK?'gok':''}" id="gerr" role="alert">${esc(GOK||GERR)}</div>
  <button class="btn wide" id="gsub" type="submit">${I(reg?'gBtnReg':'gBtnLogin')}</button>${CLOUD?`<button type="button" class="btn alt wide" data-act="gGoogle">G&nbsp; ${I('gGoogle')}</button>`:''}</form>
 <div class="gfoot"><button class="chip" data-act="gLang">🌐 ${S.lang.toUpperCase()}</button>${CLOUD?(reg?'':`<button type="button" class="gforgot" data-act="gMail">${I('gForgotMail')}</button>`):acc?`<button class="gforgot" id="gforgot" data-act="gReset">${I('gForgot')}</button>`:''}</div><p class="note">${I(CLOUD?'gNoteCloud':'gNote')}</p></div>`;
 if(focus)setTimeout(()=>{const e=$(GEMAIL?'#gPass':'#gEmail');e&&e.focus()},30)}
function showGate(dismissable){GDIS=!!dismissable;GTAB=(CLOUD||getAcc())?'login':'register';GERR='';GOK='';GARM=false;$('#gate').hidden=false;document.body.classList.add('locked');paintGate(true)}
function hideGate(){const g=$('#gate');g.hidden=true;g.innerHTML='';document.body.classList.remove('locked')}
function lockApp(){cancelAnimationFrame(fxRaf);const cv=$('#fx'),g=cv.getContext('2d');g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);$('#root').innerHTML='';sel=null;document.body.style.background='';document.title='Login';showGate(false)}
function enterApp(email){AUTH.user=email;GEMAIL='';hideGate();EDIT=true;render();fxStart();toast(I('welcome'))}
const lockState=()=>lsGet(localStorage,LCK_KEY)||{n:0,until:0};
async function doAuth(){if(CLOUD)return doAuthCloud();
 const btn=$('#gsub'),email=$('#gEmail').value.trim().toLowerCase(),pw=$('#gPass').value,reg=GTAB==='register';GEMAIL=email;GREM=$('#gRem').checked;
 const fail=m=>{GERR=m;const e=$('#gerr');if(e)e.textContent=m;if(btn)btn.disabled=false};
 if(!emailOk(email))return fail(I('gErrEmail'));
 const L=lockState();if(Date.now()<L.until)return fail(I('gErrLock').replace('{s}',Math.ceil((L.until-Date.now())/1000)));
 if(btn)btn.disabled=true;
 try{
  if(reg){
   if(getAcc()){GTAB='login';GERR=I('gHaveAcc');return paintGate(true)}
   if(pw.length<8)return fail(I('gErrPass'));
   if(pw!==$('#gPass2').value)return fail(I('gErrMatch'));
   const alg=hasSubtle()?'pbkdf2':'fb',salt=rndSalt(),hash=await derive(pw,salt,alg);
   if(!lsSet(localStorage,ACC_KEY,{email,salt,alg,hash,created:Date.now()}))return fail(I('quota'));
  }else{
   const acc=getAcc();if(!acc){GTAB='register';GERR=I('gErrNoAcc');return paintGate(true)}
   const h=await derive(pw,acc.salt,acc.alg);
   if(acc.email!==email||!h||h!==acc.hash){const n=L.n+1;lsSet(localStorage,LCK_KEY,{n,until:n>=5?Date.now()+30000*(n-4):0});return fail(I('gErrBad'))}
  }
 }catch(err){return fail(I('gErrBad'))}
 lsSet(localStorage,LCK_KEY,{n:0,until:0});GERR='';startSes(email,GREM);enterApp(email)}
document.addEventListener('submit',e=>{if(e.target.id==='gform'){e.preventDefault();doAuth()}});
addEventListener('hashchange',()=>{if(PUB&&!AUTH.user&&$('#gate').hidden)render()});
/* ============ INIT ============ */
async function boot(){
 if(!CLOUD){if(PUB){restoreSes();render();fxStart()}else if(restoreSes()){render();fxStart()}else lockApp();return}
 if(CB.recovery)RECOV=true;
 sb.auth.onAuthStateChange(onAuth);
 if(CB.err)toast(CB.err); /* mis. tautan konfirmasi kedaluwarsa */
 if(SLUG){await loadPublic(SLUG);BOOTED=true;cleanAuthUrl();return}
 /* getSession menunggu supabase-js selesai memproses token di URL callback */
 const {data}=await sb.auth.getSession();
 if(data&&data.session)await cloudStart(data.session.user,CB.fromAuth);else lockApp();
 BOOTED=true;cleanAuthUrl()}
boot();
</script>
